version: "3.9"

networks:
  portifolio-network:
    driver: bridge

services:
  portifolio-cientista-dados:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name: portifolio-cientista-dados
    restart: unless-stopped
    ports:
      - "8086:80"  # cientistadados.leoproti.com.br
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portifolio-network
    environment:
      - TZ=America/Sao_Paulo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portifolio-cientista-dados.rule=Host(`cientistadados.leoproti.com.br`)"
      - "traefik.http.routers.portifolio-cientista-dados.tls=true"
      - "traefik.http.services.portifolio-cientista-dados.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

