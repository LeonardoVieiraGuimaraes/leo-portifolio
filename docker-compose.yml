version: "3.9"

networks:
  portifolio-network:
    driver: bridge

services:
  portifolio-analista-dados:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portifolio-analista-dados
    restart: unless-stopped
    ports:
      - "8085:80"  # analistadados.leoproti.com.br
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portifolio-network
    environment:
      - TZ=America/Sao_Paulo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portifolio-analista-dados.rule=Host(`analistadados.leoproti.com.br`)"
      - "traefik.http.routers.portifolio-analista-dados.tls=true"
      - "traefik.http.services.portifolio-analista-dados.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
