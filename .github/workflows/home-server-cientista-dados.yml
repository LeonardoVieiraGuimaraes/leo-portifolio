name: Deploy to Home Server (Cientista-Dados)

on:
    push:
        branches:
            - portifolio-cientista-dados
        paths-ignore:
            - "README.md"
            - "comandos.txt"
    workflow_dispatch:

jobs:
    deploy:
        name: "🏠 Deploy to Home Server (Cientista-Dados)"
        runs-on: ubuntu-latest

        steps:
            - name: "🚚 Checkout code"
              uses: actions/checkout@v3

            - name: "⚙️ Setup Node.js"
              uses: actions/setup-node@v3
              with:
                  node-version: 20
                  cache: "npm"

            - name: "📦 Install dependencies"
              run: npm ci

            - name: "🔨 Build for Home Server"
              run: npm run build:homeserver:linux

            - name: "☁️ Setup Cloudflare"
              run: |
                  wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                  sudo dpkg -i cloudflared-linux-amd64.deb

            - name: "🔑 Setup SSH key"
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.HOME_SERVER_SSH_KEY }}

            - name: "🔐 Configure SSH"
              run: |
                  mkdir -p ~/.ssh
                  echo "Host ssh.leoproti.com.br" >> ~/.ssh/config
                  echo "  StrictHostKeyChecking no" >> ~/.ssh/config
                  echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
                  chmod 600 ~/.ssh/config

            - name: "🧹 Clean and prepare server"
              run: |
                  ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
                      leonardovieiraxy@ssh.leoproti.com.br << 'EOF'
                    mkdir -p /home/leonardovieiraxy/projetos/leo-portifolio/portifolio-cientista-dados
                    rm -rf /home/leonardovieiraxy/projetos/leo-portifolio/portifolio-cientista-dados/*
                    chmod 755 /home/leonardovieiraxy/projetos/leo-portifolio/portifolio-cientista-dados
                    exit
                  EOF

            - name: "📤 Transfer project files"
              run: |
                  mkdir -p temp-deploy
                  cp docker-compose.yml temp-deploy/
                  cp Dockerfile temp-deploy/
                  cp nginx.conf temp-deploy/
                  cp -r dist temp-deploy/
                  rsync -avz --delete \
                    -e "ssh -o ProxyCommand='cloudflared access ssh --hostname %h'" \
                    temp-deploy/ \
                    leonardovieiraxy@ssh.leoproti.com.br:/home/leonardovieiraxy/projetos/leo-portifolio/portifolio-cientista-dados/

            - name: "🚀 Deploy on server"
              run: |
                  ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
                      leonardovieiraxy@ssh.leoproti.com.br << 'EOF'
                    cd /home/leonardovieiraxy/projetos/leo-portifolio/portifolio-cientista-dados
                    echo "=== Arquivos na pasta ==="
                    ls -la
                    echo "=== Arquivos dist ==="
                    ls -la dist/ | head -5
                    echo "=== Building container ==="
                    docker compose build --no-cache
                    echo "=== Stopping and removing old container (if exists) ==="
                    docker compose down || true
                    docker rm -f leo-portifolio-cientista-dados || true
                    echo "=== Starting container ==="
                    docker compose up -d
                    echo "=== Container status ==="
                    docker compose ps
                    echo "=== Testing site ==="
                    sleep 5
                    curl -I http://localhost:8080 || echo "Site não respondeu"
                    docker system prune -f
                  EOF
